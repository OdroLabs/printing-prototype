<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff-Assisted Order Creation — PrintCraft Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content" style="padding-top:0">
    <div class="wizard-steps" id="wizSteps"></div>
    <div class="card p-4 p-md-5" style="max-width:820px;margin:0 auto" id="stepBody"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
initAdminPage("staff-order", {title:"Staff-Assisted Order Creation", subtitle:"Create an order on behalf of a customer.", breadcrumb:[{label:"Sales & Business Dev"},{label:"Staff Order Creation"}]});

const STEPS = ["Find Customer","Source","Create Order","Confirm"];
const state = { step:1, customer:null, mode:null, source:null, product:PRODUCTS[0] };

function renderWiz(){
  document.getElementById("wizSteps").innerHTML = STEPS.map((s,i)=>{
    const n=i+1; const cls = n<state.step?"done":n===state.step?"active":"";
    return `<div class="wiz-step ${cls}"><div class="wiz-circle">${n<state.step?'<i class="fa-solid fa-check"></i>':n}</div><span class="wiz-label d-none d-md-inline">${s}</span></div>${n<STEPS.length?'<div class="wiz-connector"></div>':''}`;
  }).join("");
}
function goStep(n){ state.step=n; renderWiz(); renderStep(); }
window.goStep = goStep;

function renderStep(){
  const b = document.getElementById("stepBody");
  if(state.step===1) b.innerHTML = step1();
  else if(state.step===2) b.innerHTML = step2();
  else if(state.step===3) b.innerHTML = step3();
  else b.innerHTML = step4();
}

function step1(){
  return `
  <h4 class="mb-1">Step 1 — Find Customer</h4>
  <p class="text-muted-2 mb-4">Search by phone or email, or continue with a new/guest customer.</p>
  <div class="row g-2 mb-3">
    <div class="col-md-6"><input class="form-control" placeholder="Search by phone number" id="fPhone"></div>
    <div class="col-md-6"><input class="form-control" placeholder="Search by email" id="fEmail"></div>
  </div>
  <button class="btn btn-light mb-4" onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
  <div id="searchResult"></div>
  <div class="divider-x"></div>
  <div class="row g-2">
    <div class="col-md-6"><button class="btn btn-outline-primary w-100" onclick="selectMode('register')"><i class="fa-solid fa-user-plus"></i>Register New Customer</button></div>
    <div class="col-md-6"><button class="btn btn-outline-primary w-100" onclick="selectMode('guest')"><i class="fa-solid fa-user"></i>Continue as Guest</button></div>
  </div>
  <div class="d-flex justify-content-end mt-4"><button class="btn btn-primary" ${state.customer?"":"disabled"} onclick="goStep(2)">Continue<i class="fa-solid fa-arrow-right ms-2"></i></button></div>`;
}
function doSearch(){
  document.getElementById("searchResult").innerHTML = CUSTOMERS.slice(0,1).map(c=>`
    <div class="d-flex align-items-center gap-3 p-3 rounded-3 mb-3" style="border:1px solid var(--gray-200);cursor:pointer" onclick='selectCustomer("${c.id}")'>
      <div class="avatar-circle">${initials(c.name)}</div>
      <div><div class="fw-bold">${c.name}</div><div class="text-muted-2" style="font-size:12px">${c.phone} &middot; ${c.email}</div></div>
      <span class="badge-pill badge-completed ms-auto">Existing Account</span>
    </div>`).join("");
}
function selectCustomer(id){ state.customer = CUSTOMERS.find(c=>c.id===id); state.mode="existing"; renderStep(); showToast("Customer selected: "+state.customer.name); }
function selectMode(mode){ state.mode = mode; state.customer = {name: mode==='guest'?'Guest Customer':'New Customer'}; renderStep(); showToast(mode==='guest'?"Continuing as guest":"New customer registration attached"); }
window.doSearch=doSearch; window.selectCustomer=selectCustomer; window.selectMode=selectMode;

function step2(){
  const sources = [
    {v:"BDO Brought", icon:"fa-bullhorn", desc:"Brought in by a Business Development Officer"},
    {v:"Staff Referred", icon:"fa-user-tie", desc:"Referred by another staff member"},
    {v:"Walk In Physical", icon:"fa-store", desc:"Customer walked in physically"},
  ];
  return `
  <h4 class="mb-1">Step 2 — Select Source</h4>
  <p class="text-muted-2 mb-4">How did this order originate?</p>
  <div class="row g-3">
    ${sources.map(s=>`<div class="col-md-4"><div class="card p-3 text-center h-100" style="cursor:pointer;border:2px solid ${state.source===s.v?'var(--brand-500)':'var(--gray-200)'}" onclick="setSource('${s.v}')"><i class="fa-solid ${s.icon} text-primary fs-4 mb-2"></i><div class="fw-bold" style="font-size:13.5px">${s.v}</div><div class="text-muted-2" style="font-size:11.5px">${s.desc}</div></div></div>`).join("")}
  </div>
  ${state.source==="BDO Brought" ? `<div class="mt-3"><label class="form-label">Assign BDO</label><select class="form-select" style="max-width:280px"><option>Dinusha Perera</option><option>Harindra Silva</option></select></div>` : ""}
  <div class="d-flex justify-content-between mt-4"><button class="btn btn-light" onclick="goStep(1)">Back</button><button class="btn btn-primary" ${state.source?"":"disabled"} onclick="goStep(3)">Continue<i class="fa-solid fa-arrow-right ms-2"></i></button></div>`;
}
function setSource(v){ state.source=v; renderStep(); }
window.setSource = setSource;

function step3(){
  return `
  <h4 class="mb-1">Step 3 — Create Order</h4>
  <p class="text-muted-2 mb-4">Fill in the order specification for ${state.customer.name}.</p>
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Product</label><select class="form-select" id="pProduct">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div>
    <div class="col-md-6"><label class="form-label">Service Type</label><select class="form-select"><option>Full Service</option><option>Design Only</option><option>Print Only</option></select></div>
    <div class="col-md-6"><label class="form-label">Quantity</label><input type="number" class="form-control" value="100"></div>
    <div class="col-md-6"><label class="form-label">Priority</label><select class="form-select"><option>Normal</option><option>High</option><option>Urgent</option></select></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="2" placeholder="Order notes..."></textarea></div>
  </div>
  <div class="d-flex justify-content-between mt-4"><button class="btn btn-light" onclick="goStep(2)">Back</button><button class="btn btn-primary" onclick="goStep(4)">Continue<i class="fa-solid fa-arrow-right ms-2"></i></button></div>`;
}

function step4(){
  const ref = "JOB-2026-"+(600+Math.floor(Math.random()*300));
  return `
  <div class="text-center py-3">
    <div class="stat-icon badge-completed mx-auto mb-3" style="width:70px;height:70px;font-size:30px"><i class="fa-solid fa-circle-check"></i></div>
    <h4>Order Created & Attribution Confirmed</h4>
    <p class="text-muted-2">Job reference generated and linked to the correct customer account & source.</p>
  </div>
  <div class="card p-4 mx-auto" style="max-width:460px;background:var(--gray-25)">
    <div class="d-flex justify-content-between mb-2" style="font-size:13px"><span class="text-muted-2">Job Reference</span><span class="fw-bold">${ref}</span></div>
    <div class="d-flex justify-content-between mb-2" style="font-size:13px"><span class="text-muted-2">Customer</span><span class="fw-bold">${state.customer.name}</span></div>
    <div class="d-flex justify-content-between"><span class="text-muted-2" style="font-size:13px">Source</span><span class="fw-bold">${state.source}</span></div>
  </div>
  <div class="text-center mt-4"><a href="orders.html" class="btn btn-primary">Go to Orders</a></div>`;
}

renderWiz(); renderStep();
</script>
</body>
</html>
