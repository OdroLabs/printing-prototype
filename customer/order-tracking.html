<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — PrintCraft Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background:var(--gray-25)">
<div id="site-header"></div>
<div class="container py-4" id="pageBody"></div>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
renderCustomerNav("","../");
renderSiteFooter("../");
const params = new URLSearchParams(location.search);
const ref = params.get("ref") || "JOB-2026-00452";
let order = getOrder(ref);
if(!order){ order = { ref, customer: currentUserName(), product:"Premium Business Cards", jobType:"Full Service", stage:"design_progress", qty:100, amount:1500, orderDate:"2026-08-20", expected:"2026-09-05", paymentMethod:"PayHere", paymentStatus:"Verified" }; }

const stages = pipelineForJobType(order.jobType);
const curIdx = stages.findIndex(s=>s.key===order.stage);

function stepNote(i){
  if(i < curIdx) return "Completed";
  if(i === curIdx) return "Currently in progress";
  return "Upcoming";
}
function stepDate(i){
  if(i > curIdx) return "—";
  const base = new Date(order.orderDate);
  base.setDate(base.getDate()+i);
  return base.toISOString().slice(0,10);
}

document.getElementById("pageBody").innerHTML = `
<div class="page-title-row">
  <div>
    <div class="breadcrumb-bar"><a href="dashboard.html">Dashboard</a> <i class="fa-solid fa-angle-right" style="font-size:9px"></i> <span>Order Tracking</span></div>
    <h3 class="mb-1">${order.ref}</h3>
    <p class="text-muted-2 mb-0">${order.product} &middot; ${order.jobType} &middot; Qty ${order.qty}</p>
  </div>
  ${badgeHtml(stageLabel(order.stage), stageBadgeClass(order.stage))}
</div>

<div class="card p-4 mb-4">
  <h6 class="mb-1">Job Pipeline</h6>
  <p class="text-muted-2 mb-2" style="font-size:12.5px">${order.jobType === "Print Only" ? "Print Only jobs skip the design review stages." : "Follow your job through every production stage."}</p>
  <div class="pipeline-track">
    ${stages.map((s,i)=>`
      <div class="pipeline-step ${i<curIdx?'done':i===curIdx?'current':''}">
        <div class="pipeline-node">${i<curIdx?'<i class="fa-solid fa-check"></i>':i+1}</div>
        <div class="p-label">${s.label}</div>
        <div class="p-date">${stepDate(i)}</div>
      </div>`).join("")}
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-7">
    <div class="card p-4">
      <h6 class="mb-3">Stage Details</h6>
      <div class="timeline-v">
        ${stages.map((s,i)=>`
          <div class="tl-item ${i<curIdx?'done':i===curIdx?'current':''}">
            <div class="tl-dot">${i<curIdx?'<i class="fa-solid fa-check"></i>':i===curIdx?'<i class="fa-solid fa-spinner"></i>':''}</div>
            <div class="fw-bold" style="font-size:13.5px">${s.label}</div>
            <div class="text-muted-2" style="font-size:12px">${stepNote(i)} &middot; ${stepDate(i)}</div>
            ${i===curIdx?`<div class="text-muted-2 mt-1" style="font-size:12px">Status note: Our team is actively working on this stage. We'll notify you the moment it's done.</div>`:""}
          </div>`).join("")}
      </div>
    </div>
  </div>
  <div class="col-lg-5">
    <div class="card p-4 mb-3">
      <h6 class="mb-3">Order Info</h6>
      <div class="d-flex justify-content-between mb-2" style="font-size:13px"><span class="text-muted-2">Order Date</span><span>${order.orderDate}</span></div>
      <div class="d-flex justify-content-between mb-2" style="font-size:13px"><span class="text-muted-2">Expected Completion</span><span>${order.expected}</span></div>
      <div class="d-flex justify-content-between mb-2" style="font-size:13px"><span class="text-muted-2">Payment Method</span><span>${order.paymentMethod}</span></div>
      <div class="d-flex justify-content-between"><span class="text-muted-2" style="font-size:13px">Payment Status</span>${badgeHtml(order.paymentStatus, order.paymentStatus==='Verified'?'badge-completed':'badge-pending')}</div>
    </div>
    ${order.stage==='design_progress' ? `
    <div class="card p-4" style="background:var(--warning-50);border:1px solid #fde68a">
      <i class="fa-solid fa-pen-nib text-warning mb-2"></i>
      <div class="fw-bold" style="font-size:13.5px">Design proof will appear here once ready</div>
      <a href="proof-review.html?ref=${order.ref}" class="btn btn-warning btn-sm mt-2">Check Proof Status</a>
    </div>` : ""}
  </div>
</div>
`;
</script>
</body>
</html>
