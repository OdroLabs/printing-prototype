<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Print Sign-Off — PrintCraft Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

<body class="admin-body">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content" style="padding-top:0" id="body"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
const params = new URLSearchParams(location.search);
const order = getOrder(params.get("ref")) || ORDERS[0];
initAdminPage("orders", {title:"Final Print Sign-Off", subtitle:order.ref+" — gate after sample run & QC", breadcrumb:[{label:"Operations"},{label:"Orders", href:"orders.html"},{label:"Final Sign-Off"}]});

document.getElementById("body").innerHTML = `
<div class="row g-4">
  <div class="col-lg-7">
    <div class="row g-3">
      <div class="col-6"><div style="height:180px;background:linear-gradient(135deg,var(--brand-100),var(--brand-50));border-radius:14px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-print" style="font-size:44px;color:var(--brand-500)"></i></div></div>
      <div class="col-6"><div style="height:180px;background:linear-gradient(135deg,var(--brand-100),var(--brand-50));border-radius:14px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-swatchbook" style="font-size:44px;color:var(--brand-500)"></i></div></div>
    </div>
    <div class="card p-4 mt-3">
      <h6 class="mb-2">Production Details</h6>
      <div class="row g-2" style="font-size:13px">
        <div class="col-md-6"><span class="text-muted-2">Sample Run</span><br><strong>Passed — 5 units printed</strong></div>
        <div class="col-md-6"><span class="text-muted-2">QC Result</span><br>${badgeHtml('Passed','badge-completed')}</div>
      </div>
    </div>
  </div>

    <div class="card p-4">
      <h6 class="mb-3">Final Approval</h6>
      <p class="text-muted-2" style="font-size:13px">Confirm the sample run and quality check results before releasing this job to bulk production / dispatch.</p>
      <div class="d-grid gap-2">
        <button class="btn btn-success" onclick="mockAction('Approved for dispatch','delivery.html')"><i class="fa-solid fa-check"></i>Approve for Dispatch</button>
        <button class="btn btn-outline-danger" onclick="showToast('Returned to production','warning')">Reject / Return to Production</button>
      </div>
    </div>
  </div>
</div>`;
</script>
