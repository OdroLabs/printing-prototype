<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Proof History — PrintCraft Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content" style="padding-top:0" id="body"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
const params = new URLSearchParams(location.search);
const order = getOrder(params.get("ref")) || ORDERS[0];
initAdminPage("orders", {title:"Client Proof History", subtitle:order.ref+" — every version is retained, never overwritten.", breadcrumb:[{label:"Operations"},{label:"Orders", href:"orders.html"},{label:"Proof History"}]});

const versions = [
  {v:2, date:"2026-08-29", designer:order.assignedDesigner||"Nuwan Dias", internal:"Approved", client:"Awaiting Response", comment:"—"},
  {v:1, date:"2026-08-27", designer:order.assignedDesigner||"Nuwan Dias", internal:"Approved", client:"Changes Requested", comment:"\"Please increase the logo size and adjust the gold accent.\""},
];
document.getElementById("body").innerHTML = versions.map(v=>`
  <div class="card p-4 mb-3">
    <div class="row g-4 align-items-center">
      <div class="col-md-3">
        <div style="height:130px;background:linear-gradient(135deg,var(--brand-100),var(--brand-50));border-radius:12px;display:flex;align-items:center;justify-content:center">
          <i class="fa-solid fa-swatchbook" style="font-size:34px;color:var(--brand-500)"></i>
        </div>
      </div>
      <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-bold">Version ${v.v}</span>
          <span class="text-muted-2" style="font-size:12px">${v.date}</span>
        </div>
        <div class="row g-2" style="font-size:12.8px">
          <div class="col-md-3"><span class="text-muted-2">Designer</span><br><strong>${v.designer}</strong></div>
          <div class="col-md-3"><span class="text-muted-2">Internal Approval</span><br>${badgeHtml(v.internal,'badge-completed')}</div>
          <div class="col-md-3"><span class="text-muted-2">Client Response</span><br>${badgeHtml(v.client, v.client==='Awaiting Response'?'badge-pending':'badge-neutral')}</div>
          <div class="col-md-3"><span class="text-muted-2">Comments</span><br><span>${v.comment}</span></div>
        </div>
      </div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
