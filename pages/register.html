<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — PrintCraft Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="container py-5" style="max-width:560px">
  <div class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="stat-icon badge-brand mx-auto mb-3" style="width:52px;height:52px"><i class="fa-solid fa-user-plus"></i></div>
      <h4 class="mb-1">Create Your Account</h4>
      <p class="text-muted-2" style="font-size:13.5px">Join PrintCraft Studio to start ordering and tracking jobs.</p>
    </div>
    <form onsubmit="return doRegister(event)">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" placeholder="e.g. Kasun Peiris" required></div>
        <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="you@email.com" required></div>
        <div class="col-md-6"><label class="form-label">Phone Number</label><input type="tel" class="form-control" placeholder="077 123 4567" required></div>
        <div class="col-md-6"><label class="form-label">WhatsApp Number</label><input type="tel" class="form-control" placeholder="077 123 4567"></div>
        <div class="col-md-6"><label class="form-label">Password</label><input type="password" class="form-control" placeholder="••••••••" required></div>
        <div class="col-md-6"><label class="form-label">Confirm Password</label><input type="password" class="form-control" placeholder="••••••••" required></div>
        <div class="col-12">
          <label class="form-label">Preferred Notification Channel</label>
          <div class="d-flex gap-3">
            <div class="form-check"><input class="form-check-input" type="radio" name="notif" id="notifWa" checked><label class="form-check-label" for="notifWa"><i class="fa-brands fa-whatsapp text-success me-1"></i>WhatsApp</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="notif" id="notifEmail"><label class="form-check-label" for="notifEmail"><i class="fa-solid fa-envelope text-primary me-1"></i>Email</label></div>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-4">Create Account</button>
    </form>
    <div class="text-center mt-4" style="font-size:13.5px">Already have an account? <a href="login.html">Login</a></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
renderCustomerNav("register","../");
renderSiteFooter("../");
function doRegister(e){
  e.preventDefault();
  setDemoRole("Customer","New Customer");
  showToast("Account created successfully!");
  setTimeout(()=>{ window.location.href = "../customer/dashboard.html"; }, 800);
  return false;
}
</script>
</body>
</html>
