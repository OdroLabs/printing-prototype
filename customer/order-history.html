<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History — PrintCraft Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background:var(--gray-25)">
<div id="site-header"></div>
<div class="container py-4">
  <div class="page-title-row"><div><h3 class="mb-1">Order History</h3><p class="text-muted-2 mb-0">All your past and current orders.</p></div></div>

  <div class="table-card">
    <div class="table-toolbar">
      <input type="text" class="form-control" style="max-width:280px" id="searchBox" placeholder="Search job reference or product...">
      <div class="d-flex gap-2 flex-wrap">
        <select class="form-select form-select-sm" id="statusFilter" style="width:170px">
          <option value="">All Statuses</option>
        </select>
        <input type="date" class="form-control form-control-sm" style="width:160px">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table-pro w-100">
        <thead><tr><th>Job Reference</th><th>Product</th><th>Service Type</th><th>Date</th><th>Status</th><th>Amount</th><th>Action</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
renderCustomerNav("","../");
renderSiteFooter("../");
const statusSel = document.getElementById("statusFilter");
statusSel.innerHTML += PIPELINE_STAGES.map(s=>`<option value="${s.key}">${s.label}</option>`).join("");

function renderRows(){
  const q = document.getElementById("searchBox").value.toLowerCase();
  const st = statusSel.value;
  const list = ORDERS.filter(o => (!q || o.ref.toLowerCase().includes(q) || o.product.toLowerCase().includes(q)) && (!st || o.stage===st)).slice(0,20);
  document.getElementById("tbody").innerHTML = list.map(o=>`
    <tr>
      <td class="fw-bold">${o.ref}</td>
      <td>${o.product}</td>
      <td>${o.jobType}</td>
      <td>${o.orderDate}</td>
      <td>${badgeHtml(stageLabel(o.stage), stageBadgeClass(o.stage))}</td>
      <td>${fmtMoney(o.amount)}</td>
      <td>
        <a href="order-tracking.html?ref=${o.ref}" class="btn btn-light btn-sm">View</a>
        <button class="btn btn-outline-primary btn-sm" onclick="reorder('${o.ref}')">Reorder</button>
      </td>
    </tr>`).join("") || `<tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-inbox"></i><h6>No orders found</h6></div></td></tr>`;
}
document.getElementById("searchBox").addEventListener("input", renderRows);
statusSel.addEventListener("change", renderRows);
function reorder(ref){ showToast("Cart pre-filled from "+ref+" — redirecting to new order..."); setTimeout(()=>location.href="create-order.html",800); }
renderRows();
</script>
</body>
</html>
