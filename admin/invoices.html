<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices, Quotations & Receipts — PrintCraft Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content" style="padding-top:0">
    <div class="tabs-pro">
      <div class="tab-item active" data-tab="quo">Quotations</div>
      <div class="tab-item" data-tab="inv">Invoices</div>
      <div class="tab-item" data-tab="rec">Receipts</div>
    </div>
    <div id="tabBody"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
initAdminPage("invoices", {title:"Invoices, Quotations & Receipts", subtitle:"Financial documents across all orders.", breadcrumb:[{label:"Finance"},{label:"Invoices"}],
  actionsHtml:`<button class="btn btn-primary btn-sm" onclick="showToast('New document form would open here')"><i class="fa-solid fa-plus"></i>New Document</button>`});

function docsTab(prefix, label){
  const rows = ORDERS.slice(0,8).map((o,i)=>({num:`${prefix}-2026-${1000+i}`, o, status: i%3===0?'Draft':i%3===1?'Sent':'Paid'}));
  return `<div class="table-card"><div class="table-responsive"><table class="table-pro w-100">
    <thead><tr><th>Document No.</th><th>Customer</th><th>Job</th><th>Amount</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr><td class="fw-bold">${r.num}</td><td>${r.o.customer}</td><td>${r.o.ref}</td><td>${fmtMoney(r.o.amount)}</td><td>${r.o.orderDate}</td>
      <td>${badgeHtml(r.status, r.status==='Paid'?'badge-completed':r.status==='Sent'?'badge-progress':'badge-neutral')}</td>
      <td>
        <button class="btn btn-light btn-sm" onclick="showToast('Opening ${label.slice(0,-1)} preview (mock)')">View</button>
        <button class="btn btn-light btn-sm" onclick="showToast('Downloading PDF (mock)')"><i class="fa-solid fa-download"></i></button>
        <button class="btn btn-light btn-sm" onclick="showToast('Print dialog would open (mock)')"><i class="fa-solid fa-print"></i></button>
        <button class="btn btn-light btn-sm" onclick="showToast('Emailed to customer (mock)')"><i class="fa-solid fa-envelope"></i></button>
      </td></tr>`).join("")}</tbody>
  </table></div></div>`;
}
const tabs = { quo:()=>docsTab("QUO","Quotations"), inv:()=>docsTab("INV","Invoices"), rec:()=>docsTab("REC","Receipts") };
function showTab(k){ document.getElementById("tabBody").innerHTML = tabs[k](); }
document.querySelectorAll(".tab-item").forEach(t=>t.addEventListener("click",()=>{ document.querySelectorAll(".tab-item").forEach(x=>x.classList.remove("active")); t.classList.add("active"); showTab(t.dataset.tab); }));
showTab("quo");
</script>
</body>
</html>
