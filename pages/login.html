<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PrintCraft Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="container py-5" style="max-width:440px">
  <div class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="stat-icon badge-brand mx-auto mb-3" style="width:52px;height:52px"><i class="fa-solid fa-right-to-bracket"></i></div>
      <h4 class="mb-1">Welcome Back</h4>
      <p class="text-muted-2" style="font-size:13.5px">Login to track orders and manage your account.</p>
    </div>
    <form onsubmit="return doLogin(event)">
      <div class="mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" placeholder="you@email.com" value="nimal.perera@gmail.com" required></div>
      <div class="mb-2"><label class="form-label">Password</label><input type="password" class="form-control" placeholder="••••••••" value="password123" required></div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="remember" checked><label class="form-check-label" for="remember" style="font-size:13px">Remember me</label></div>
        <a href="#" style="font-size:12.8px" onclick="showToast('Password reset link sent (mock)','info');return false;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-4" style="font-size:13.5px">Don't have an account? <a href="register.html">Register</a></div>
    <div class="divider-x"></div>
    <div class="text-center"><a href="track-order.html" style="font-size:12.8px"><i class="fa-solid fa-magnifying-glass me-1"></i>Track an order as guest</a></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
renderCustomerNav("login","../");
renderSiteFooter("../");
function doLogin(e){
  e.preventDefault();
  setDemoRole("Customer","Nimal Perera");
  showToast("Login successful. Redirecting to your dashboard...");
  setTimeout(()=>{ window.location.href = "../customer/dashboard.html"; }, 800);
  return false;
}
</script>
</body>
</html>
