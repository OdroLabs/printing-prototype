<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Clearance Queue — PrintCraft Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content" style="padding-top:0">
    <div class="row g-4" id="grid"></div>
  </div>
</div>

<!-- Full Rebuild modal -->
<div class="modal fade" id="rebuildModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Additional Design Charge Required</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="text-muted-2" style="font-size:13.5px">This file needs a full rebuild. Choose how to proceed:</p>
        <div class="d-grid gap-2">
          <button class="btn btn-light text-start" onclick="rebuildAction('Discuss With Client')"><i class="fa-solid fa-comments me-2"></i>Discuss With Client</button>
          <button class="btn btn-light text-start" onclick="rebuildAction('Add Design Component')"><i class="fa-solid fa-plus me-2"></i>Add Design Component</button>
          <button class="btn btn-light text-start" onclick="rebuildAction('Client Declined')"><i class="fa-solid fa-thumbs-down me-2"></i>Client Declined</button>
          <button class="btn btn-light text-start" onclick="rebuildAction('Close Job')"><i class="fa-solid fa-box-archive me-2"></i>Close Job</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
initAdminPage("orders", {title:"Graphic Designer Clearance Queue", subtitle:"Print Only jobs flagged for AI-content / print-readiness review.", breadcrumb:[{label:"Operations"},{label:"Orders", href:"orders.html"},{label:"AI Clearance"}]});

const flagged = ORDERS.filter(o=>o.jobType==="Print Only").slice(0,6).map((o,i)=>({
  ...o, reason: i%2===0 ? "Flagged as AI-generated by customer" : "Low resolution / print-readiness concern",
}));

document.getElementById("grid").innerHTML = flagged.map(o=>`
  <div class="col-md-6 col-xl-4">
    <div class="card p-3 h-100">
      <div style="height:130px;background:linear-gradient(135deg,var(--brand-100),var(--brand-50));border-radius:12px;display:flex;align-items:center;justify-content:center">
        <i class="fa-solid fa-file-image" style="font-size:30px;color:var(--brand-500)"></i>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <span class="job-ref">${o.ref}</span>
        ${badgeHtml('AI: '+(o.isAiGenerated||'Yes'), 'badge-flagged')}
      </div>
      <div class="fw-bold" style="font-size:13px">${o.customer}</div>
      <div class="text-muted-2 mb-2" style="font-size:11.8px">${o.reason}</div>
      <div class="text-muted-2 mb-2" style="font-size:11px">Spec: ${o.category} &middot; ${o.qty} units &middot; 300dpi CMYK</div>
      <div class="d-flex gap-2 mt-auto">
        <button class="btn btn-success btn-sm flex-grow-1" onclick="showToast('${o.ref} cleared for print')">Clear</button>
        <button class="btn btn-light btn-sm flex-grow-1" onclick="showToast('${o.ref} flagged for light touch-up')">Light Touchup</button>
        <button class="btn btn-outline-danger btn-sm flex-grow-1" data-bs-toggle="modal" data-bs-target="#rebuildModal">Needs Full Rebuild</button>
      </div>
    </div>
  </div>`).join("");

function rebuildAction(action){
  bootstrap.Modal.getInstance(document.getElementById("rebuildModal")).hide();
  showToast("Action recorded: "+action);
}
</script>
</body>
</html>
