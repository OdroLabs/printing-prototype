<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — PrintCraft Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content" style="padding-top:0">
    <div class="table-card">
      <div class="table-toolbar">
        <input type="text" class="form-control" style="max-width:260px" id="searchBox" placeholder="Search job ref, customer...">
        <div class="d-flex gap-2 flex-wrap">
          <select class="form-select form-select-sm" id="stageFilter" style="width:180px"><option value="">All Stages</option></select>
          <select class="form-select form-select-sm" id="serviceFilter" style="width:150px"><option value="">All Services</option><option>Full Service</option><option>Design Only</option><option>Print Only</option></select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table-pro w-100">
          <thead><tr><th>Job Ref</th><th>Customer</th><th>Service Type</th><th>Product</th><th>Amount</th><th>Payment</th><th>Stage</th><th>Assigned Staff</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center p-3">
        <span class="text-muted-2" style="font-size:12.5px" id="pageInfo"></span>
        <nav><ul class="pagination pagination-sm mb-0">
          <li class="page-item"><a class="page-link" href="#">Prev</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul></nav>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
initAdminPage("orders", {title:"Orders & Job Pipeline", subtitle:"All orders across the platform.", breadcrumb:[{label:"Operations"},{label:"Orders"}],
  actionsHtml:`<a href="job-pipeline.html" class="btn btn-light btn-sm"><i class="fa-solid fa-table-columns"></i>Pipeline View</a><a href="staff-order-creation.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i>New Order</a>`});
document.getElementById("stageFilter").innerHTML += PIPELINE_STAGES.map(s=>`<option value="${s.key}">${s.label}</option>`).join("");

function render(){
  let list = [...ORDERS];
  const q = document.getElementById("searchBox").value.toLowerCase();
  if(q) list = list.filter(o=>o.ref.toLowerCase().includes(q)||o.customer.toLowerCase().includes(q));
  const stage = document.getElementById("stageFilter").value;
  if(stage) list = list.filter(o=>o.stage===stage);
  const svc = document.getElementById("serviceFilter").value;
  if(svc) list = list.filter(o=>o.jobType===svc);
  document.getElementById("pageInfo").textContent = `Showing ${Math.min(list.length,15)} of ${list.length} orders`;
  document.getElementById("tbody").innerHTML = list.slice(0,15).map(o=>`
    <tr>
      <td class="fw-bold">${o.ref}</td><td>${o.customer}</td><td>${o.jobType}</td><td>${o.product}</td><td>${fmtMoney(o.amount)}</td>
      <td>${badgeHtml(o.paymentStatus, o.paymentStatus==='Verified'?'badge-completed':'badge-pending')}</td>
      <td>${badgeHtml(stageLabel(o.stage), stageBadgeClass(o.stage))}</td>
      <td>${o.assignedDesigner || o.assignedTechnician || '—'}</td>
      <td>${o.orderDate}</td>
      <td>
        <div class="dropdown">
          <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">Actions</button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><a class="dropdown-item" href="order-details.html?ref=${o.ref}"><i class="fa-solid fa-eye fa-fw me-2"></i>View</a></li>
            <li><a class="dropdown-item" href="order-details.html?ref=${o.ref}#edit"><i class="fa-solid fa-pen fa-fw me-2"></i>Edit</a></li>
            <li><a class="dropdown-item" href="my-queue.html"><i class="fa-solid fa-user-check fa-fw me-2"></i>Assign</a></li>
            <li><a class="dropdown-item" href="job-pipeline.html"><i class="fa-solid fa-table-columns fa-fw me-2"></i>View Pipeline</a></li>
            <li><a class="dropdown-item" href="#" onclick="showToast('Job duplicated as new draft order');return false;"><i class="fa-solid fa-copy fa-fw me-2"></i>Duplicate / Rebook</a></li>
          </ul>
        </div>
      </td>
    </tr>`).join("") || `<tr><td colspan="10"><div class="empty-state"><i class="fa-solid fa-box-open"></i><h6>No orders match your filters</h6></div></td></tr>`;
}
document.getElementById("searchBox").addEventListener("input", render);
document.getElementById("stageFilter").addEventListener("change", render);
document.getElementById("serviceFilter").addEventListener("change", render);
render();
</script>
</body>
</html>
